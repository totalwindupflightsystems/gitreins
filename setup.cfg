# Python style-hygiene configuration — pycodestyle / flake8 (PYLINT-GITREINS).
#
# WHY THIS FILE AND NOT pyproject.toml:
#   pycodestyle does NOT read pyproject.toml. It loads its project config from
#   `setup.cfg` or `tox.ini` (pycodestyle.py: PROJECT_CONFIG = ('setup.cfg',
#   'tox.ini')), so THIS file is the effective configuration. The matching
#   `[tool.pycodestyle]` block in pyproject.toml is the documented register of
#   the same policy, kept for discoverability from the canonical project file.
#
#   flake8 (used here only to run flake8-bugbear's `B` checks) does read
#   setup.cfg, so its section carries the per-file exemptions bugbear needs.
#
# Effective: with pycodestyle 2.15.0, `pycodestyle gitreins/ tests/` reports
# zero violations.

[pycodestyle]
# Project standard is 100 (matches [tool.ruff].line-length in pyproject.toml).
max-line-length = 100
# NOTE: pycodestyle has no per-file ignore mechanism, and setting `ignore`
# REPLACES its built-in default list (pycodestyle.py:2372) — so the defaults are
# restated here alongside the two project-wide exemptions.
#
#   E203 — `whitespace before ':'` is incompatible with this repo's gated
#          formatter: `ruff format` (GR-GAP-063) rewrites `x[a - b:]` to
#          `x[a - b :]` for complex slice operands, so "fixing" every E203
#          would fail `ruff format --check`. Black ships E203 in its own
#          recommended ignore list for exactly this reason.
#   E501 — line length is policed by ruff at 100 with a per-file policy:
#          engine/evaluator.py, engine/commit_audit.py, engine/config.py,
#          engine/guard_manager.py, engine/pipeline.py, gitreins/serve.py,
#          gitreins/cli.py, gitreins_mcp/server.py and scripts/judgment_viewer.py
#          carry embedded LLM prompts, HTML/CSS/JS templates, long help strings
#          and regexes that cannot be wrapped without changing behaviour.
#          pycodestyle cannot express per-file ignores, so it defers to ruff
#          instead of duplicating a weaker copy of that policy.
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E203,E501
# pycodestyle's built-in exclude default, plus the venv/build trees and the
# fixture trees whose files are *intentionally* non-conforming:
#   tests/fixtures/secrets  — deliberately malformed Python (Jinja templates and
#                             shell scripts carrying a .py extension) used as
#                             secret-scanner inputs; already excluded from ruff.
#   tests/reliability       — deliberately buggy fixtures for reliability
#                             benchmarks (pyproject.toml already excludes them
#                             from mypy for the same reason).
exclude = .svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.venv,.venv312,build,dist,node_modules,.memory-bank,sandbox,tests/fixtures/secrets,tests/reliability

[flake8]
max-line-length = 100
extend-ignore = E203,E501
# flake8's built-in exclude default, plus the venv/build trees.
#   tests/fixtures/secrets — not Python at all (Jinja templates and shell
#                            scripts carrying a .py extension), so it is
#                            excluded wholesale rather than per-code.
exclude = .svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg,.venv,.venv312,build,dist,node_modules,.memory-bank,sandbox,tests/fixtures/secrets
# tests/reliability keeps its other checks, but its deliberately bare `except:`
# (B001) is the fixture's feature — the reliability benchmarks require it.
# NOTE: flake8's per-file-ignores has no `ALL` sentinel; codes must be named.
per-file-ignores =
    tests/reliability/*:B001

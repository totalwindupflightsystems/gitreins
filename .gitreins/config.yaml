guards:
  secrets: true
  lint: true
  tests: true
  test_mode: diff
  # INT-CI-13: the docs-drift gate is chained onto the test command so the
  # LOCAL guard (and the pre-commit hook, which just runs `gitreins guard` in
  # the repo root) runs scripts/check_docs_drift.py — the live pytest
  # collection happens inside the script, so the pytest call below is the
  # collection step it consumes. Without the chain, test-count drift only
  # surfaces in CI (the guard cannot see this class; 3 CI reds: GR-GAP-019
  # era, INT-CI-12, tick 319). A drifted claim FAILS the commit before push.
  test_command: >-
    python3 scripts/check_docs_drift.py &&
    uv run pytest -x --tb=short
  test_timeout: 900
  # TRUST-001: this repo's own gate is graded by `pytest tests/ -v` in CI, and
  # `gitreins guard` here runs on a clean checkout (nothing staged → lint/tests
  # skip, so the run is a DEGRADED pass). Accept that explicitly instead of
  # exiting 2 on every CI run. The DEGRADED line is still printed, so a skip
  # can never read as a graded pass.
  allow_skips: true
  dead_code: false
  skylos: false
  static_analysis: false
  # static_analysis disabled 2026-07-19: 2150 pre-existing mypy --strict errors.
  # Re-enable after GR-099 type annotation project. Ruff/lint covers quality meanwhile.
  static_analysis_tools:
    python:
    - mypy
  lsp: true
  lsp_tools:
  - pylsp
evaluator:
  max_iterations: 200
  max_time: 45m
  max_input_tokens: 10M
  max_output_tokens: 131072  # 128K — deepseek API caps max_tokens at 393216; 1M caused HTTP 400 on every judge call (2026-08-20)
  tool_call_weight: 0.1
  compaction_threshold: 0.9
  code_context_budget: 0.7
  file_scope: changed
  fast_track: auto
defaults:
  model: deepseek-v4-flash
history:
  enabled: true
  storage: git
  max_verdicts: 1000

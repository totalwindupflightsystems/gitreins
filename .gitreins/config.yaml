guards:
  secrets: true
  lint: true
  tests: true
  test_mode: diff
  # INT-CI-13: the docs-drift gate is chained onto the test command so the
  # LOCAL guard (and the pre-commit hook, which just runs `gitreins guard` in
  # the repo root) runs scripts/check_docs_drift.py — the live pytest
  # collection happens inside the script, so the pytest call below is the
  # collection step it consumes. Without the chain, test-count drift only
  # surfaces in CI (the guard cannot see this class; 3 CI reds: GR-GAP-019
  # era, INT-CI-12, tick 319). A drifted claim FAILS the commit before push.
  # Interpreter-pinned 2026-09-22 (REVIEW-008): the bare `uv run pytest` form resolved
  # `pytest` from PATH, and on a host where the agent runtime's venv sits first on PATH
  # that is a DIFFERENT pytest (no pytest-xdist → `unrecognized arguments: -n` from
  # addopts) — the test lane then FAILS for an environment reason and blocks every
  # commit that touches pyproject/Makefile/.gitreins/config.yaml. Pin the repo venv.
  test_command: >-
    .venv/bin/python scripts/check_docs_drift.py &&
    .venv/bin/python -m pytest -x --tb=short
  test_timeout: 900
  # TRUST-001: this repo's own gate is graded by `pytest tests/ -v` in CI, and
  # `gitreins guard` here runs on a clean checkout (nothing staged → lint/tests
  # skip, so the run is a DEGRADED pass). Accept that explicitly instead of
  # exiting 2 on every CI run. The DEGRADED line is still printed, so a skip
  # can never read as a graded pass.
  allow_skips: true
  dead_code: false
  skylos: false
  static_analysis: true
  # static_analysis re-enabled 2026-10-26: REVIEW-GITREINS-010 closed. Strict mypy
  # tranches (SCOPE1-17) reduced 2150 errors to 0 across 46 source files under
  # mypy 2.4.0. The guard now runs mypy --strict on every commit.
  static_analysis_tools:
    python:
    - mypy
  lsp: true
  lsp_tools:
  - pylsp
evaluator:
  max_iterations: 400
  max_time: 90m  # 60m→90m (GR-148 tick: tier2 capped at exactly 1h under fleet load on GLM lane)
  max_input_tokens: 10M
  max_output_tokens: 131072  # 128K — deepseek API caps max_tokens at 393216; 1M caused HTTP 400 on every judge call (2026-08-20)
  tool_call_weight: 0.1
  compaction_threshold: 0.9
  code_context_budget: 0.7
  file_scope: changed
  fast_track: auto
defaults:
  model: deepseek-v4-flash
history:
  enabled: true
  storage: git
  max_verdicts: 1000

# Jev resolution gate (JEVRES-006). This repo runs the CLI and MCP surfaces for real;
# the two judge-adjacent surfaces stay false — no calibration numbers exist until
# JEVRES-005 lands, and an uncalibrated band must never drive a skip-dispatch or a judge
# pre-screen. `model`, `tokens_max`, `bands` and `egress_exclude` are omitted on purpose:
# an omitted key IS the built-in default, and those defaults are the measured ones in
# docs/jev-resolution-gate.md §2/§9 (the single design authority). Only a literal `true`
# opens a surface; absent/false/wrong-typed all read as OFF.
resolution:
  enabled:
    cli: true
    mcp: true
    predispatch: false
    judge_prescreen: false

# Tier-1 data protection (GR-146). DISABLED here: a repo with no PII/network
# policy needs no change, and `enabled: false` (like an absent block) is a
# no-op. Only a literal `enabled: true` arms the lane, and the guard and the
# Tier-1 judge read this one block through build_policy, so they can never
# disagree. Credentials stay owned by the `secrets` lane above and can never be
# filtered, excepted or weakened here. Full reference: docs/data-protection.md.
data_protection:
  enabled: false
  # Example (uncomment to opt in):
  # categories:
  #   pii:
  #     detection: block        # off | warn | block
  #     handling: redact        # preserve | redact | replace
  #     confidence: 0.7         # class floor; lower to enable phone/medical/names
  #   ip_addresses:
  #     detection: warn
  #     handling: replace
  #     default_action: redact
  #     preserve_list: ["10.0.0.0/8", "2001:db8::/32"]
  # exceptions:
  #   - category: ip_addresses
  #     rule: ipv4
  #     match: 198.51.100.7
  #     scope: "docs/*"
  #     reason: "RFC 5737 documentation address"
